<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneClick AI - Test Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      border: 1px solid #334155;
    }
    h2 {
      margin-top: 0;
      font-size: 1.5rem;
      border-bottom: 2px solid #3b82f6;
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input, select, textarea {
      background: #0f172a;
      border: 1px solid #475569;
      color: #f1f5f9;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #3b82f6;
    }
    button[type="submit"] {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button[type="submit"]:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Job Application Test Form</h2>
    <form id="jobForm" onsubmit="event.preventDefault(); alert('Form submitted!');">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Your full name" required>
      </div>

      <div class="form-group">
        <label for="companyName">Company Name</label>
        <input type="text" id="companyName" placeholder="Current Company / Employer" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="example@domain.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="+1 (555) 000-0000">
      </div>

      <div class="form-group">
        <label for="linkedin">LinkedIn URL</label>
        <input type="text" id="linkedin" placeholder="https://linkedin.com/in/username">
      </div>

      <div class="form-group">
        <label for="notice">Notice Period (Days)</label>
        <input type="number" id="notice" placeholder="30">
      </div>

      <div class="form-group">
        <label for="currentCTC">Current Salary (CTC)</label>
        <input type="text" id="currentCTC" placeholder="e.g. 100,000 USD">
      </div>

      <div class="form-group">
        <label for="role">Target Role</label>
        <select id="role">
          <option value="">Select Role</option>
          <option value="Software Engineer">Software Engineer</option>
          <option value="Product Manager">Product Manager</option>
          <option value="Data Scientist">Data Scientist</option>
        </select>
      </div>

      <div class="form-group" style="flex-direction: row; align-items: center; gap: 20px; margin-top: 10px; margin-bottom: 16px;">
        <span style="font-size: 0.85rem; font-weight: 600; color: #94a3b8;">Gender:</span>
        <label style="display: inline-flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0;">
          <input type="radio" name="gender" value="Male" style="margin: 0;"> Male
        </label>
        <label style="display: inline-flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0;">
          <input type="radio" name="gender" value="Female" style="margin: 0;"> Female
        </label>
      </div>

      <div class="form-group" style="flex-direction: row; align-items: center; gap: 20px; margin-bottom: 16px;">
        <span style="font-size: 0.85rem; font-weight: 600; color: #94a3b8;">Require Visa Sponsorship?</span>
        <label style="display: inline-flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0;">
          <input type="radio" name="sponsorship" value="Yes" style="margin: 0;"> Yes
        </label>
        <label style="display: inline-flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0;">
          <input type="radio" name="sponsorship" value="No" style="margin: 0;"> No
        </label>
      </div>

      <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px; margin-bottom: 16px;">
        <input type="checkbox" id="authorized" name="authorized" style="margin: 0; cursor: pointer;">
        <label for="authorized" style="margin-bottom: 0; cursor: pointer; font-weight: normal; font-size: 0.85rem;">I am legally authorized to work in this country</label>
      </div>

      <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px; margin-bottom: 16px;">
        <input type="checkbox" id="terms" name="terms" style="margin: 0; cursor: pointer;" required>
        <label for="terms" style="margin-bottom: 0; cursor: pointer; font-weight: normal; font-size: 0.85rem;">I agree to the Terms of Service and Privacy Policy</label>
      </div>

      <button type="submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
